<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="Alcopop, Alcohol, Pipe Major, Jones & Me, Beat, whisky, wine, alcop, spiritis" />
    <meta
      name="description"
      content="The Go-To-Market Platform for Alcohol Brands in India"
    />

    <link rel="canonical" href="https://alcopopspirits.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alcopop Spirits" />
    <meta property="og:title" content="Alcopop Spirits" />
    <meta
      property="og:description"
      content="The Go-To-Market Platform for Alcohol Brands in India"
    />
    <meta property="og:url" content="https://alcopopspirits.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alcopop Spirits" />
    <meta
      name="twitter:description"
      content="The Go-To-Market Platform for Alcohol Brands in India"
    />

    <!-- ─── FAVICONS / APP ICONS ─── -->
    <!-- Rounded SVG icon: modern browsers prefer this over the PNGs below -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon/favicon.svg" />
    <!-- Large square PNGs first: Google renders favicons at ~48px and needs a
         square of at least 48x48, then masks it into a circle -->
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon/favicon-48.png" />
    <!-- Root /favicon.ico (96x96): crawlers request this path directly -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />

    <link rel="apple-touch-icon" sizes="57x57" href="%PUBLIC_URL%/favicon/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="%PUBLIC_URL%/favicon/apple-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="%PUBLIC_URL%/favicon/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="%PUBLIC_URL%/favicon/apple-icon-76x76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="%PUBLIC_URL%/favicon/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/favicon/apple-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="%PUBLIC_URL%/favicon/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/favicon/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon/apple-icon-180x180.png" />

    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/favicon/ms-icon-144x144.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->

    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Alcopop Spirits</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
